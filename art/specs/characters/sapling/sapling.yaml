spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: sapling
kind: character
camera: {"pitch": 38, "scale": 0.04889, center: [0, 0.38, 0]}
palette: "watra"
size: 32
directions: 8
shadow: {rx: 5, ry: 2, alpha: 90}

# Sadzonka - zwykła roślina zostawiana przez broń natury „Kostur Leszego”. Do 12 naraz na polu walki, więc
# mała: około 16-18 px wysokości (połowa goblina), klatka 32. Własny szkielet: kopczyk ziemi, pęd z trzech kości
# (gnie się przy kołysaniu i więdnięciu), liście na kościach przy pędzie, dwie świecące drobinki.
brief:
  summary: >
    a young oak/hazel shoot, about 17 px tall, rising from a small mound of dark soil with a few pale roots
    poking out: a thin olive-green stem with five light green leaves (two pairs and a top tuft), two tiny
    glowing green motes drifting around it
  head: the top tuft of three leaves is the head - the brightest green, it sways the most
  must_keep:
    - the mound + stem + bright leaves read (a plant, not a bush or a weed)
    - small and calm: the motes are 1 px and only two
  simplify:
    - leaves are flat ellipsoids on their own bones, no veins
    - roots are three short tapered cones on the mound
  decisions:
    - the plant looks the same from every side (leaves spread around the stem), so 8 directions only turn it
    - spawn grows the whole plant from the mound with an overshoot; death droops the leaves, turns them
      brown (material switch on `dry`) and sinks the stem into the mound

ramps:
  leaf:   ["#0c1a08", "#24501a", "#3a8228", "#5eaa38", "#8ccc52", "#c2e888"]
  leaf_dry: ["#141006", "#4a4014", "#7c6c22", "#a8973c", "#cfc068"]
  shoot:  ["#120d06", "#34361a", "#506222", "#728632", "#9aab4c"]
  soil:   ["#0c0705", "#2a170d", "#462a17", "#603c24", "#7c5436"]
  root:   ["#120907", "#4d2f1a", "#7a5532", "#a37a4e", "#c29e6c"]
  mote:   ["#0f2a10", "#5ee07a", "#a6ff9e", "#e8ffd0"]

materials:
  leaf:     {ramp: leaf, finish: soft}
  leaf_dry: {ramp: leaf_dry, finish: matte}
  shoot:    {ramp: shoot, finish: matte}
  soil:     {ramp: soil, finish: matte}
  root:     {ramp: root, finish: matte}
  mote:     {ramp: mote, emissive: true, band: 2, outline: false, glow: {color: "#8cff8c", mix: 0.25, radius: 1}}

channels:
  mound: 1.0     # scale of the soil mound (spawn pops it up)
  grow: 1.0      # scale of the whole plant above the mound
  sway: 0.0      # stem bend sideways (radians per segment)
  nod: 0.0       # stem bend forward/back (radians per segment)
  wave: 0.0      # leaf flutter (radians)
  droop: 0.0     # leaves hang down (radians), death
  wilt: 0.0      # stem bends over (radians per segment), death
  sink: 0.0      # plant sinks into the mound (units)
  dry: 0.0       # >= 0.5: leaves turn brown
  m: 0.0         # mote orbit phase
  glow: 1.0      # mote size (0 hides them)

bones:
  plant:  {parent: root, pos: "[0, 0.10 - sink, 0]", scale: "max(grow, 0.02)"}
  stem0:  {parent: plant, rot: "[nod + 0.6*wilt, 0, sway + 0.3*wilt]"}
  stem1:  {parent: stem0, pos: [0, 0.22, 0], rot: "[nod + wilt, 0, sway + 0.5*wilt]"}
  stem2:  {parent: stem1, pos: [0, 0.22, 0], rot: "[nod + wilt, 0, sway + 0.5*wilt]"}
  top:    {parent: stem2, pos: [0, 0.20, 0]}
  # leaves: local z is the leaf's length; negative x-rot raises the tip
  leaf_a: {parent: stem1, pos: [0, 0.10, 0], rot: "[-0.35 + droop + wave, 0.3, 0]"}
  leaf_b: {parent: stem1, pos: [0, 0.12, 0], rot: "[-0.35 + droop - wave, 3.44, 0]"}
  leaf_c: {parent: stem2, pos: [0, 0.10, 0], rot: "[-0.55 + droop - wave, 1.87, 0]"}
  leaf_d: {parent: stem2, pos: [0, 0.12, 0], rot: "[-0.55 + droop + wave, -1.27, 0]"}
  leaf_e: {parent: top, rot: "[-1.0 + 0.8*droop + 0.6*wave, 0.6, 0]"}
  leaf_f: {parent: top, rot: "[-0.9 + 0.8*droop - 0.6*wave, 2.7, 0]"}
  leaf_g: {parent: top, rot: "[-0.9 + 0.8*droop + 0.6*wave, -1.5, 0]"}
  motes:  {parent: root, rot: "[0, m, 0]"}

parts:
  mound:
    material: soil
    space: root
    when: "mound > 0.05"
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.0, 0], r: "[0.19*mound, 0.12*mound, 0.17*mound]"}
      - ellipsoid: {c: [0.10, 0.0, 0.06], r: "[0.10*mound, 0.07*mound, 0.09*mound]"}
      - ellipsoid: {c: [-0.09, 0.0, -0.07], r: "[0.10*mound, 0.06*mound, 0.10*mound]"}
  roots:
    material: root
    space: root
    when: "mound > 0.3"
    min_cover: 2
    prims:
      - cone: {a: "[0.12*mound, 0.06*mound, 0.10*mound]", b: "[0.27*mound, 0.01, 0.17*mound]", r: [0.035, 0.018]}
      - cone: {a: "[-0.15*mound, 0.05*mound, 0.06*mound]", b: "[-0.29*mound, 0.01, 0.12*mound]", r: [0.035, 0.018]}
      - cone: {a: "[0.02*mound, 0.05*mound, -0.15*mound]", b: "[0.06*mound, 0.01, -0.29*mound]", r: [0.035, 0.018]}
  stem:
    material: shoot
    space: plant
    when: "grow > 0.08"
    min_cover: 2
    blend: 0.02
    prims:
      - cone: {a: "@stem0", b: "@stem1", r: [0.045, 0.038]}
      - cone: {a: "@stem1", b: "@stem2", r: [0.038, 0.032]}
      - cone: {a: "@stem2", b: "@top", r: [0.032, 0.026]}
  leaves:
    material: leaf
    space: plant
    when: "grow > 0.15 and dry < 0.5"
    prims: &leaf_prims
      - ellipsoid: {c: {at: leaf_a, off: [0, 0, 0.12]}, r: [0.085, 0.03, 0.13], align: ["@leaf_a", {at: leaf_a, off: [0, 0, 1]}]}
      - ellipsoid: {c: {at: leaf_b, off: [0, 0, 0.12]}, r: [0.085, 0.03, 0.13], align: ["@leaf_b", {at: leaf_b, off: [0, 0, 1]}]}
      - ellipsoid: {c: {at: leaf_c, off: [0, 0, 0.11]}, r: [0.08, 0.03, 0.12], align: ["@leaf_c", {at: leaf_c, off: [0, 0, 1]}]}
      - ellipsoid: {c: {at: leaf_d, off: [0, 0, 0.11]}, r: [0.08, 0.03, 0.12], align: ["@leaf_d", {at: leaf_d, off: [0, 0, 1]}]}
      - ellipsoid: {c: {at: leaf_e, off: [0, 0, 0.10]}, r: [0.075, 0.03, 0.115], align: ["@leaf_e", {at: leaf_e, off: [0, 0, 1]}]}
      - ellipsoid: {c: {at: leaf_f, off: [0, 0, 0.10]}, r: [0.075, 0.03, 0.115], align: ["@leaf_f", {at: leaf_f, off: [0, 0, 1]}]}
      - ellipsoid: {c: {at: leaf_g, off: [0, 0, 0.10]}, r: [0.075, 0.03, 0.115], align: ["@leaf_g", {at: leaf_g, off: [0, 0, 1]}]}
  # the same leaves, withered brown (death)
  leaves_dry:
    material: leaf_dry
    space: plant
    when: "grow > 0.15 and dry >= 0.5"
    prims: *leaf_prims
  # two tiny glowing motes drifting around the shoot
  motes:
    material: mote
    space: motes
    when: "glow > 0.1"
    min_cover: 2
    prims:
      - sphere: {c: "[0.26, 0.42 + 0.10*sin(m*2), 0]", r: "0.032*glow"}
      - sphere: {c: "[-0.22, 0.62 + 0.10*sin(m*2 + 2.5), 0.12]", r: "0.028*glow"}

sockets:
  top: {bone: top}      # the leafy top: where a heal / buff effect can spawn

animations:
  # calm sway: the stem bends a pixel each way, the leaves flutter behind it, motes drift
  idle:
    frames: 8
    ms: 150
    channels:
      sway: "0.07*sin(p)"
      nod: "0.04*sin(p + 1.2)"
      wave: "0.18*sin(p - 0.9)"
      m: "p"
  # grows out of the ground: the mound heaves up, the shoot pushes out and overshoots, settles
  spawn:
    loop: false
    keys:
      - {ms: 60, set: {mound: 0.4, grow: 0.0, glow: 0}}
      - {ms: 60, set: {mound: 0.9, grow: 0.0, glow: 0}}
      - {ms: 70, set: {mound: 1.05, grow: 0.35, droop: 0.6, glow: 0}}
      - {ms: 70, set: {mound: 1.0, grow: 0.7, droop: 0.4, nod: 0.05, glow: 0.5}}
      - {ms: 80, set: {grow: 1.12, droop: -0.15, nod: -0.05, wave: -0.1, glow: 1}}
      - {ms: 90, set: {grow: 0.97, droop: 0.05, nod: 0.03, wave: 0.1}}
  # withers: the leaves droop and turn brown, the stem bends over and sinks into the mound
  death:
    loop: false
    keys:
      - {ms: 70, set: {droop: 0.4, wilt: 0.08, glow: 0.6}}
      - {ms: 80, set: {droop: 0.8, wilt: 0.18, glow: 0.3}}
      - {ms: 90, set: {droop: 1.1, wilt: 0.30, dry: 1, sink: 0.03, glow: 0}}
      - {ms: 100, set: {droop: 1.3, wilt: 0.42, dry: 1, sink: 0.07, grow: 0.9, glow: 0}}
      - {ms: 330, set: {droop: 1.4, wilt: 0.50, dry: 1, sink: 0.10, grow: 0.82, glow: 0}}
