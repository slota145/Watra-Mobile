      - {ms: 140, set: {coat: 0.06}}
  # ice spikes: the staff lifted high in both hands, then its butt slammed into the ground (`hit` on the slam: the
  # spikes burst out from socket `staff_foot`), a held crouch, recovery
  spikes:
    loop: false
    keys:
