          hand_L: [0.38, 0.16, 0.16], hand_R: [0.26, 0.24, 0.20]}}
      - {ms: 80, event: release, set: {root: [0, 0, 0.04], bob: -0.03, lean: 0.23, squash: 0.96, head_pitch: 0.12, coat: 0.3, beard_sway: -0.22,
          hand_L: [0.38, 0.10, 0.34], hand_R: [0.34, 0.04, 0.10], breath: 0.45}}
      - {ms: 150, set: {root: [0, 0, 0.05], bob: -0.04, lean: 0.26, squash: 0.95, head_pitch: 0.14, coat: 0.35, beard_sway: -0.26,
