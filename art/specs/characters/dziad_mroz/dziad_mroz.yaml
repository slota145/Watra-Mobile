          hand_L: [0.45, 0.67, 0.10], hand_R: [0.61, 0.41, 0.08], staff_splay: 0.15, sglow: 1.0}}
      - {ms: 110, set: {root: [0.02, 0, 0], roll: 0.02, bob: 0.04, lean: -0.14, squash: 1.04, head_pitch: -0.24, coat: -0.25, beard_sway: -0.05,
          hand_L: [0.45, 0.60, 0.11], hand_R: [0.60, 0.36, 0.09], staff_splay: 0.15, sglow: 0.8}}
      - {ms: 110, set: {root: [-0.02, 0, 0], roll: -0.02, bob: 0.04, lean: -0.14, squash: 1.04, head_pitch: -0.24, coat: -0.25, beard_sway: -0.05,
