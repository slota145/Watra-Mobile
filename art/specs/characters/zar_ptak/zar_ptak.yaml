spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: zar_ptak
kind: character
camera: {"pitch": 38, "scale": 0.04889, center: [0, 1.05, -0.2]}
palette: "watra"
size: 64        # większa klatka (ta sama gęstość): rozłożone skrzydła i długi ogon nie mieszczą się w 48
directions: 8
shadow: {rx: 9.0, ry: 3.2, alpha: 110}

# Żar-ptak: strzelający potwór lochu „Zajęta Świątynia Słońca”, żywioł Prawia (światło bogów). Słowiański
# ognisty ptak wielkości dużego orła-pawia, unosi się nad ziemią i strzela promieniem z dzioba. Bez obrazu
# referencyjnego. Własny szkielet (bez szablonu humanoida): kość `body` na wysokości lotu niesie całość.
brief:
  summary: >
    ognisty ptak wielkości orła-pawia (sylwetka ok. 30-34 px), unoszący się ok. 8 px nad swoim cieniem:
    złoto-pomarańczowe pióra przechodzące w jasne, prawie białe końce, szeroko rozłożone skrzydła z jasnymi
    lotkami, długi ogon z pięciu piór zakończonych świecącymi „oczkami” jak u pawia, korona z trzech
    piórek ze świecącymi kulkami na głowie, złoty dziób
  head: >
    mała okrągła głowa na krótkiej szyi, złoty dziób stożkiem do przodu (dolna szczęka osobno - `beak_open`),
    twarz minimalna: tylko dwa ciemne oczka po bokach głowy; korona z trzech cienkich piórek (środkowe
    najwyższe) zakończonych świecącymi kulkami - drugi rozpoznawalny kształt obok ogona
  must_keep:
    - rozłożone skrzydła z jasnymi, świecącymi końcami lotek (czytelna sylwetka w tłumie)
    - długi ogon z pięciu piór ze świecącymi „oczkami” (emisja)
    - świecąca korona na głowie
    - przerwa powietrza między ptakiem a cieniem (lata)
    - ciepłe złoto i pomarańcz z jasnymi, prawie białymi końcówkami (Prawia - światło, a nie ciemny ogień)
  simplify:
    - skrzydło to błona (`membrane`) z wycięciami lotek na tylnej krawędzi, z grubszą krawędzią natarcia;
      zewnętrzna część skrzydła na osobnej kości (`wtip_L`), która ugina się z opóźnieniem (`flap_tip`)
    - jasne końce lotek to malowanie (`paint`) świecącym materiałem na zewnętrznej części skrzydła
    - pióro ogona to stożek-trzonek i spłaszczona elipsoida „oczka” (pomarańczowa obwódka, biały środek)
  decisions:
    - całość świeci tylko na końcach (korona, oczka ogona, końce skrzydeł, dziób w ataku); ciało to
      zwykły złoty materiał z cieniowaniem, żeby ptak miał bryłę
    - idle - powolne machanie skrzydłami i lekkie unoszenie; walk - lot naprzód - ciało pochylone, szybsze
      machanie, ogon ciągnie się z tyłu (`trail`)
    - attack (850 ms) - ptak cofa głowę i rozkłada szeroko skrzydła (dziób rozjarza się - `charge`), potem
      wyrzuca głowę do przodu z otwartym dziobem i błyskiem; zdarzenie `release` po 600 ms; socket `beak`
      na czubku dzioba (stamtąd wychodzi promień)
    - death - wstrząs, skrzydła się składają, ptak opada i rozpada się w iskry (`burst`), zostaje garstka
      żaru na ziemi (`cinder`)

ramps:
  # pióra: złoto-pomarańczowe, ciepłe cienie
  plume:   ["#240a05", "#5e1c0a", "#9a3510", "#cc5a16", "#ec8a24", "#ffc050"]
  # pióra skrzydeł i ogona: od czerwieni u nasady do złota
  gplume:  ["#2a0c05", "#6a240a", "#a84414", "#d8701e", "#f0a030", "#fcd070"]
  # świecące końcówki (Prawia): od złota do bieli
  shine:   ["#8a5212", "#ffd060", "#fff2c0", "#ffffff"]
  # obwódka „oczka” pawiego pióra: pomarańczowy żar
  ring:    ["#7a2408", "#ff7a1a", "#ffb23d", "#ffe08a"]
  # środek „oczka”: ciemna czerwień jak źrenica
  pupil:   ["#1a0406", "#4a0a10", "#7a1418"]
  # dziób i szpony
  beak:    ["#2a1404", "#7a4a10", "#c89030", "#f0d070", "#fff4c0"]
  # głowa: jaśniejsze złoto niż ciało (głowa ma odcinać się od skrzydeł)
  headg:   ["#2a1004", "#7a3a0c", "#c0701c", "#eaa83a", "#fcd870", "#fff2b8"]
  # ciemne oczka
  coal:    ["#0a0403", "#1c0a06", "#30140a"]
  # wnętrze dzioba
  maw:     ["#1a0604", "#4a1006", "#7a2008"]

materials:
  plume:  {ramp: plume, finish: soft, gamma: 1.2, bands: [1, 4]}
  gplume: {ramp: gplume, finish: matte, two_sided: true, gamma: 1.3, bands: [1, 4]}
  shine:  {ramp: shine, emissive: true, band: 2, outline: false, glow: {color: "#ffe9a0", mix: 0.3, radius: 1}}
  core:   {ramp: shine, emissive: true, band: 3, outline: false}
  ring:   {ramp: ring, emissive: true, band: 2, outline: false}
  beak:   {ramp: beak, finish: glossy}
  headg:  {ramp: headg, finish: soft, bands: [1, 4]}
  eye:    {ramp: coal, bands: [1, 2], line: false, outline: false}
  maw:    {ramp: maw, bands: [1, 2], line: false}
  pupil:  {ramp: pupil, emissive: true, band: 2, outline: false}

channels:
  bob: 0            # unoszenie się (w górę / w dół)
  push: 0           # całe ciało do przodu (+z) - szarpnięcie przy strzale
  lean: 0.05        # pochylenie ciała do przodu (lot)
  twist: 0          # skręt ciała
  roll: 0           # przechył na bok
  neck_pitch: 0     # szyja do przodu (+) / cofnięta (-)
  neck_z: 0         # głowa wysunięta do przodu (+) / cofnięta (-)
  head_pitch: 0     # głowa w dół (+) / w górę (-)
  beak_open: 0      # otwarcie dzioba (radiany dolnej szczęki)
  crest: 0          # piórka korony odchylone do tyłu (+)
  flap: 0.25        # skrzydło w górę (+) / w dół (-), radiany
  flap_tip: 0       # zewnętrzna część skrzydła ugina się w górę (+) / w dół (-)
  sweep: 0          # skrzydła zagarnięte do tyłu (+) / wyciągnięte do przodu (-)
  fold: 0           # złożenie skrzydeł (0..1, śmierć)
  trail: 0          # ogon ciągnie się do tyłu-w górę (lot)
  tail_swing: 0     # ogon na boki
  tail_wave: 0      # falowanie piór ogona (faza)
  fan: 1            # rozłożenie wachlarza ogona
  charge: 0         # rozjarzenie dzioba przed strzałem (0..1)
  flash: 0          # błysk u dzioba w chwili strzału (0..1)
  alive: 1          # 0 chowa ptaka (koniec śmierci)
  shrink: 1         # skala całego ptaka (śmierć)
  burst: 0          # śmierć: iskry rozlatują się (0..1)
  cinder: 0         # śmierć: garstka żaru na ziemi (0..1)

bones:
  # całe ciało w powietrzu: środek na wysokości 0.95
  center:  {parent: root, pos: "[0, 1.05 + bob, push]", scale: "1.35*shrink"}
  body:    {parent: center, rot: "[lean, twist, roll]"}
  neck:    {parent: body, pos: [0, 0.10, 0.14], rot: "[neck_pitch - 0.35, 0, 0]"}
  head:    {parent: neck, pos: "[0, 0.20, 0.03 + neck_z]", inherit_rot: false, rot: "[lean*0.5 + head_pitch, twist, roll*0.5]", scale: 1.45}
  jaw:     {parent: head, pos: [0, -0.015, 0.06], rot: "[beak_open, 0, 0]"}
  crown:   {parent: head, pos: [0, 0.07, -0.01], rot: "[-0.35 - crest, 0, 0]"}
  # skrzydła: bark przy boku ciała; złożenie (`fold`) zagarnia je do tyłu i opuszcza
  wing_L:  {parent: body, pos: [0.10, 0.07, 0.02], rot: "[0.15*fold, -sweep - 1.3*fold, flap - 0.9*fold]", scale: "1 - 0.35*fold"}
  wtip_L:  {parent: wing_L, pos: [0.36, 0.02, 0.0], rot: "[0, 0.15*fold, flap_tip]"}
  # ogon: od kupra do tyłu i w dół; `trail` podnosi go za ptakiem
  tailbase: {parent: body, pos: [0, -0.06, -0.20], rot: "[0.0 + trail - lean*0.6, 0, tail_swing]"}

parts:
  body:              # pierś i kuper w jednej bryle
    material: plume
    space: body
    when: "alive > 0"
    blend: 0.06
    prims:
      - ellipsoid: {c: [0, 0.03, 0.06], r: [0.14, 0.16, 0.15]}
      - ellipsoid: {c: [0, -0.04, -0.10], r: [0.11, 0.11, 0.15]}
  neck:
    material: plume
    when: "alive > 0"
    blend: 0.04
    prims:
      - cone: {a: "@neck", b: "@head", r: [0.075, 0.06]}
  head:
    material: headg
    space: head
    when: "alive > 0"
    prims:
      - ellipsoid: {c: [0, 0, 0], r: [0.075, 0.075, 0.085]}
  beak_up:           # górna część dzioba: złoty stożek do przodu
    material: beak
    space: head
    when: "alive > 0"
    priority: 2
    prims:
      - cone: {a: [0, 0.005, 0.05], b: [0, -0.02, 0.15], r: [0.035, 0.008]}
  beak_low:          # dolna szczęka (otwiera się przy strzale)
    material: beak
    space: jaw
    when: "alive > 0"
    priority: 2
    prims:
      - cone: {a: [0, -0.01, 0.0], b: [0, -0.02, 0.07], r: [0.025, 0.007]}
  maw:               # wnętrze otwartego dzioba
    material: maw
    space: jaw
    when: "alive > 0 and beak_open > 0.15"
    prims:
      - sphere: {c: [0, 0.005, 0.02], r: 0.022}
  charge_glow:       # rozjarzony dziób przed strzałem i błysk w chwili strzału
    material: core
    space: head
    when: "alive > 0 and (charge > 0.05 or flash > 0.05)"
    min_cover: 1
    priority: 3
    prims:
      - sphere: {c: "[0, -0.02, 0.15 + 0.06*flash]", r: "0.045*charge + 0.075*flash"}
  eye_L:             # małe ciemne oczko z boku głowy
    material: eye
    space: head
    when: "alive > 0"
    min_cover: 2
    priority: 2
    prims:
      - sphere: {c: [0.048, 0.022, 0.05], r: 0.03}
  crest:             # korona: trzy cienkie piórka
    material: gplume
    space: crown
    when: "alive > 0"
    min_cover: 2
    priority: 2
    prims:
      - cone: {a: [0, 0, 0], b: [0, 0.17, 0], r: [0.018, 0.012]}
      - cone: {a: [0.01, 0, 0], b: [0.085, 0.10, -0.02], r: [0.016, 0.01]}
      - cone: {a: [-0.01, 0, 0], b: [-0.085, 0.10, -0.02], r: [0.016, 0.01]}
  crest_tips:        # świecące kulki na końcach piórek korony
    material: shine
    space: crown
    when: "alive > 0"
    min_cover: 2
    priority: 2
    prims:
      - sphere: {c: [0, 0.18, 0], r: 0.03}
      - sphere: {c: [0.09, 0.105, -0.02], r: 0.024}
      - sphere: {c: [-0.09, 0.105, -0.02], r: 0.024}
  # --- skrzydła ---
  wing_L:            # wewnętrzna część: grubsza krawędź natarcia i błona do łokcia
    material: gplume
    space: wing_L
    when: "alive > 0"
    blend: 0.03
    prims:
      - tube: {pts: [[0, 0, 0.02], [0.18, 0.03, 0.07], [0.38, 0.02, 0.04]], r: [0.055, 0.035]}
      - membrane: {hub: [0.02, 0, 0.0], th: 0.03, scallop: [2, 3], scallop_depth: 0.3,
                   ring: [[0.0, 0, 0.05], [0.38, 0.02, 0.06], [0.40, 0, -0.18], [0.27, 0, -0.22], [0.12, 0, -0.20], [0.0, 0, -0.12]]}
  wtip_L:            # zewnętrzna część: lotki zakończone jasnym, świecącym piórem
    material: gplume
    space: wtip_L
    when: "alive > 0"
    blend: 0.02
    prims:
      - tube: {pts: [[-0.02, 0, 0.04], [0.15, 0.0, 0.03], [0.30, -0.01, -0.03]], r: [0.035, 0.02]}
      - membrane: {hub: [0.0, 0, -0.04], th: 0.03, scallop: [2, 3, 4], scallop_depth: 0.35,
                   ring: [[0.0, 0, 0.05], [0.18, 0, 0.04], [0.34, -0.01, -0.04], [0.30, -0.01, -0.15], [0.18, 0, -0.20], [0.05, 0, -0.20], [-0.02, 0, -0.15]]}
    paint:
      - material: shine
        prims:
          - sphere: {c: [0.36, 0, -0.12], r: 0.16}
  # --- ogon ---
  tail:              # pięć długich piór: trzonki rozchodzące się w wachlarz
    material: gplume
    space: tailbase
    when: "alive > 0"
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 0, -0.06], r: [0.09, 0.04, 0.10]}
      - cone: {a: [0, 0, 0], b: "[0, 0.03*sin(tail_wave), -0.62]", r: [0.05, 0.03]}
      - cone: {a: [0.02, 0, 0], b: "[0.16*fan, 0.03*sin(tail_wave - 0.8), -0.56]", r: [0.045, 0.028]}
      - cone: {a: [-0.02, 0, 0], b: "[-0.16*fan, 0.03*sin(tail_wave + 0.8), -0.56]", r: [0.045, 0.028]}
      - cone: {a: [0.03, 0, 0], b: "[0.30*fan, 0.03*sin(tail_wave - 1.6), -0.44]", r: [0.04, 0.026]}
      - cone: {a: [-0.03, 0, 0], b: "[-0.30*fan, 0.03*sin(tail_wave + 1.6), -0.44]", r: [0.04, 0.026]}
  tail_rings:        # „oczka” pawich piór: jasna, świecąca tarcza z ciemnym środkiem
    material: shine
    space: tailbase
    when: "alive > 0"
    min_cover: 2
    prims:
      - ellipsoid: {c: "[0, 0.03*sin(tail_wave), -0.68]", r: [0.075, 0.03, 0.085]}
      - ellipsoid: {c: "[0.175*fan, 0.03*sin(tail_wave - 0.8), -0.62]", r: [0.068, 0.03, 0.078], rot: [0, 0.25, 0]}
      - ellipsoid: {c: "[-0.175*fan, 0.03*sin(tail_wave + 0.8), -0.62]", r: [0.068, 0.03, 0.078], rot: [0, -0.25, 0]}
      - ellipsoid: {c: "[0.33*fan, 0.03*sin(tail_wave - 1.6), -0.49]", r: [0.062, 0.03, 0.072], rot: [0, 0.55, 0]}
      - ellipsoid: {c: "[-0.33*fan, 0.03*sin(tail_wave + 1.6), -0.49]", r: [0.062, 0.03, 0.072], rot: [0, -0.55, 0]}
    paint:
      - material: pupil
        prims:
          - sphere: {c: "[0, 0.03*sin(tail_wave), -0.68]", r: 0.048}
          - sphere: {c: "[0.175*fan, 0.03*sin(tail_wave - 0.8), -0.62]", r: 0.048}
          - sphere: {c: "[-0.175*fan, 0.03*sin(tail_wave + 0.8), -0.62]", r: 0.048}
          - sphere: {c: "[0.33*fan, 0.03*sin(tail_wave - 1.6), -0.49]", r: 0.048}
          - sphere: {c: "[-0.33*fan, 0.03*sin(tail_wave + 1.6), -0.49]", r: 0.048}
  talons:            # podkulone szpony pod brzuchem
    material: beak
    space: body
    when: "alive > 0"
    min_cover: 2
    prims:
      - cone: {a: [0.05, -0.12, 0.0], b: [0.06, -0.20, 0.04], r: [0.028, 0.015]}
      - cone: {a: [-0.05, -0.12, 0.0], b: [-0.06, -0.20, 0.04], r: [0.028, 0.015]}
  # śmierć: iskry rozlatujące się na boki i w górę, malejące
  sparks:
    material: shine
    space: root
    when: "burst > 0 and burst < 1"
    min_cover: 2
    prims:
      - sphere: {c: "[0.45*burst, 0.95 + 0.30*burst, 0.10]", r: "0.05*(1 - 0.7*burst)"}
      - sphere: {c: "[-0.48*burst, 1.00 + 0.25*burst, -0.05]", r: "0.05*(1 - 0.7*burst)"}
      - sphere: {c: "[0.15*burst, 1.10 + 0.40*burst, 0.35*burst]", r: "0.045*(1 - 0.7*burst)"}
      - sphere: {c: "[-0.20*burst, 1.05 + 0.35*burst, -0.40*burst]", r: "0.045*(1 - 0.7*burst)"}
      - sphere: {c: "[0.35*burst, 0.70 - 0.20*burst, -0.30*burst]", r: "0.045*(1 - 0.7*burst)"}
      - sphere: {c: "[-0.32*burst, 0.65 - 0.25*burst, 0.30*burst]", r: "0.045*(1 - 0.7*burst)"}
  sparks_ring:
    material: ring
    space: root
    when: "burst > 0 and burst < 1"
    min_cover: 2
    prims:
      - sphere: {c: "[0.30*burst, 0.90 + 0.15*burst, -0.35*burst]", r: "0.04*(1 - 0.6*burst)"}
      - sphere: {c: "[-0.30*burst, 0.85 + 0.20*burst, 0.35*burst]", r: "0.04*(1 - 0.6*burst)"}
  # śmierć: garstka żaru na ziemi i trzy opadłe pióra ze świecącymi końcami
  cinder:
    material: ring
    space: root
    when: "cinder > 0"
    min_cover: 2
    prims:
      - ellipsoid: {c: [0, 0.03, 0], r: "[0.17*cinder, 0.045, 0.13*cinder]"}
  cinder_core:
    material: core
    space: root
    when: "cinder > 0"
    min_cover: 2
    prims:
      - sphere: {c: [0.02, 0.06, 0.01], r: "0.055*cinder"}
      - sphere: {c: "[0.20*cinder, 0.03, -0.08*cinder]", r: 0.03}
      - sphere: {c: "[-0.18*cinder, 0.03, 0.10*cinder]", r: 0.03}
  fallen:            # opadłe pióra leżące na ziemi
    material: gplume
    space: root
    when: "cinder > 0"
    min_cover: 2
    prims:
      - ellipsoid: {c: "[0.30*cinder, 0.02, 0.12]", r: [0.05, 0.02, 0.14], rot: [0, 0.9, 0]}
      - ellipsoid: {c: "[-0.30*cinder, 0.02, -0.05]", r: [0.05, 0.02, 0.14], rot: [0, -0.5, 0]}
      - ellipsoid: {c: "[0.05, 0.02, -0.28*cinder]", r: [0.05, 0.02, 0.13], rot: [0, 1.8, 0]}
    paint:
      - material: shine
        prims:
          - sphere: {c: "[0.30*cinder + 0.10, 0.02, 0.12 + 0.08]", r: 0.06}
          - sphere: {c: "[-0.30*cinder - 0.06, 0.02, -0.05 + 0.11]", r: 0.06}
          - sphere: {c: "[0.05 + 0.12, 0.02, -0.28*cinder - 0.03]", r: 0.06}

timing: {attack: {release: 600ms, total: 850ms}}

sockets:
  beak: {bone: head, offset: [0, -0.02, 0.17]}   # czubek dzioba: stąd wychodzi promień

animations:
  idle:
    frames: 8
    ms: 130
    channels:
      bob: "0.04*sin(p + 1.4)"
      flap: "0.12 + 0.30*sin(p)"
      flap_tip: "0.25*sin(p - 0.9)"
      tail_wave: "p"
      tail_swing: "0.05*sin(p - 1.0)"
      crest: "0.15*sin(p - 1.2)"
      head_pitch: "0.04*sin(p - 0.6)"
  # lot naprzód: ciało pochylone, szybsze i mocniejsze machanie, ogon ciągnie się z tyłu
  walk:
    frames: 8
    ms: 90
    channels:
      lean: 0.32
      bob: "0.035*sin(p + 1.4)"
      flap: "0.15 + 0.50*sin(p)"
      flap_tip: "0.35*sin(p - 0.9)"
      sweep: "0.12 + 0.08*sin(p + 0.5)"
      trail: "0.30 + 0.06*sin(p - 1.5)"
      tail_wave: "p"
      tail_swing: "0.06*sin(p - 1.2)"
      fan: 0.8
      crest: "0.45 + 0.1*sin(p - 1.2)"
      neck_pitch: 0.15
      head_pitch: "-0.15 + 0.04*sin(p - 0.6)"
  # strzał promieniem: ptak cofa głowę i rozkłada wysoko skrzydła, dziób rozjarza się (`charge` - zapowiedź
  # dla gracza), potem szarpnięcie do przodu z otwartym dziobem i błyskiem (`release` po 600 ms), skrzydła
  # biją w dół, powrót. Razem 850 ms
  attack:
    loop: false
    keys:
      - {ms: 80, event: windup, set: {neck_pitch: -0.15, neck_z: -0.02, head_pitch: -0.1, flap: 0.5, flap_tip: 0.1,
          crest: 0.3, charge: 0.2, lean: 0.0, tail_wave: 0.4}}
