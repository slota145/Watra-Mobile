spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: sniezyca
camera: {"pitch": 38, "scale": 0.04889, center: [0, 1.05, 0]}
palette: "watra"
size: 64
extends: humanoid   # the template's skeleton, head kit and hair kit; legs hidden under the gown

# Śnieżnica: strzelający potwór lochu „Lodowe jaskinie” (duchy zimy, żywioł lód). Mroźna wiła: smukła kobieca
# zjawa unosząca się nad ziemią, w długiej białej sukni z długimi, postrzępionymi rękawami; dół sukni
# przechodzi w szron (lodowobłękitny) i postrzępione sople, a pod nim snuje się mroźna mgła. Bladoniebieska
# skóra, długie lodowobiałe włosy rozwiane na boki, korona z lodowych sopli (kokosznik), świecące zimne oczy,
# wokół dłoni krążą drobne kryształki lodu. Atak z dystansu: zamach prawą ręką, w dłoni rośnie sopel
# i leci (zdarzenie `release`, socket `sopel`). Śmierć: rozpada się w szron i lodowe okruchy.
brief:
  summary: >
    sniezyca (Polish "Śnieżnica"), the ranged enemy of the ice dungeon "Ice caves" (element: ice): a frost wila,
    a winter spirit of Slavic folklore. Slim feminine apparition (same size as the wind wila), hovering above
    the ground: a long white gown with long tattered bell sleeves; the lower gown turns into ice-blue frost and
    ends in jagged icicle points, a frosty mist drifts below the hem. Pale-blue skin, long ice-white hair blown
    out to BOTH sides and back by a freezing wind, a crown of icicles (kokoshnik) on the head, glowing cold
    ice-blue eyes, tiny ice crystals orbiting each hand. Attack: one-arm throw of an icicle.
  head: >
    the head kit with a narrow soft jaw; the hair kit with a light fringe and long temple locks; over it a
    back mane and two side locks that fan OUTWARD to both sides (not to one side like the wind wila), rippling
    with `flut`; a crown of five icicles standing up behind the fringe; face minimal (style): two glowing
    ice-blue eyes, no nose, no mouth
  must_keep:
    - clearly NOT the wind wila - ice-white/bluish hair (not gold), no blue ribbons/sash, long tattered sleeves
      (not bare arms), a frost-blue lower gown with jagged icicle points, the icicle crown
    - a bright cold silhouette (white gown, white hair, ice crown) against a dark floor, readable in a crowd
    - the glowing ice-blue eyes; the ice crystals around the hands; the icicle in the throwing hand
    - the floating gap under the hem, filled with a faint frosty mist
  simplify:
    - no legs or feet (the gown hides them, parts switched off), no jewellery besides the crown
    - crystals are tiny emissive ellipsoids (1x2 px); the frost on the gown is a painted band
  decisions:
    - the hover - like the wind wila (torso 0.95), the hem reaches lower but ends in points, mist below
    - the wind blows from her front - hair streams back and out to both sides (symmetric, `_L` locks mirrored)
    - the icicle - an emissive ice cone in the right hand while `frost` > 0 (windup), gone on `release`
      (the game spawns the projectile at socket `sopel`)
    - death - she shatters into frost - the body shrinks (`fade`) and rises, frost mist swells (`puff`) and
      ice shards fly outward (`shatter`), the last frame is a thin frosty wisp with a few shards
    - frame 64 px - room for the raised throwing arm, crown and hair
    - game contract - `attack` event `windup` at 0 ms, `release` at 420 ms, total 720 ms; sockets `sopel`
      (projectile spawn, right hand), `hand_L` / `hand_R`

ramps:
  # pale-blue skin (a winter spirit)
  sn_skin:  ["#0a1430", "#26467e", "#3f6aaa", "#5e8cca", "#82aee0", "#a8caee"]
  # ice-white hair with cold lavender-blue shadows
  sn_hair:  ["#0e1226", "#4a5888", "#8092c0", "#b8c9e6", "#e2ecf8", "#ffffff"]
  # the white gown, cold
  sn_gown:  ["#0c1426", "#455c80", "#7f97ba", "#b6c8e0", "#e2ecf7", "#fdfeff"]
  # frost: the lower gown turning to ice
  sn_frost: ["#071a2c", "#22567f", "#3c86b8", "#6cb6e0", "#a6daf4", "#dcf4fd"]
  # ice: the crown (solid, glossy)
  sn_ice:   ["#081630", "#1c4a88", "#3a7ec4", "#72baec", "#bce6fe", "#ffffff"]
  # glowing cold eyes, crystals and the icicle
  sn_glow:  ["#0a2448", "#4aa8ff", "#a8dcff", "#f2fbff"]
  # the frosty mist
  sn_mist:  ["#1a2838", "#5a7490", "#90aac4", "#c2d8ea", "#ecf6fc"]

materials:
  skin:   {ramp: sn_skin, gamma: 0.75, finish: soft}
  hair:   {ramp: sn_hair, finish: matte}
  gown:   {ramp: sn_gown, finish: matte}
  frost:  {ramp: sn_frost, finish: soft}
  ice:    {ramp: sn_ice, finish: glossy}
  eye:    {ramp: sn_glow, emissive: true, band: 3, outline: false, glow: {color: "#6cc4ff", mix: 0.3, radius: 1}}
  shard:  {ramp: sn_glow, emissive: true, band: 2, outline: false, glow: {color: "#7ccaff", mix: 0.3, radius: 1}}
  sopel:  {ramp: sn_glow, emissive: true, band: 2, outline: false, glow: {color: "#7ccaff", mix: 0.4, radius: 1}}
  mist:   {ramp: sn_mist, finish: matte, outline: false, line: false}

remove: [use.sword, parts.belt, parts.coat, animations.idle, animations.walk, animations.attack]

use:
  - {kit: head, as: head, at: head, with: {width: 0.86, jaw: 0.1, chin: 0.6, nose: 0, ears: 0}}
  - {kit: hair, as: hair, at: head, with: {fringe: 0.2, part: 0.2, locks: 0.8, length: 1.4, volume: 0.95}}

shadow: {rx: 8.5, ry: 3, alpha: 70}

channels:
  hand_L: [0.27, 0.06, 0.08]
  hand_R: [0.27, 0.06, 0.08]
  hair_flow: 0.15  # the long hair lifts back (+) in the wind
  hair_fan: 0      # the side locks fan further out
  flut: 0          # phase of the flutter (hair tips, sleeve tails, mist)
  spin: 0          # phase of the crystals orbiting the hands
  frost: 0         # 0..1: the icicle in the right hand (attack)
  fade: 0          # 0..1: the body dissolves (death)
  puff: 0          # 0..1: frost mist swells around her (death)
  shatter: 0       # 0..1: ice shards fly outward (death)

bones:
  big:        {parent: root, scale: "1.04*(1 - 0.95*fade)"}
  # hovering: the waist sits higher than a walking human's, the hem ends above the ground
  torso_rot:  {parent: big, pos: "[0, 0.95 + bob + 0.25*fade, 0]", rot: "[lean, twist, roll]"}
  legyaw:     {parent: big}
  footyaw:    {parent: big}
  headbase:   {pos: [0, 0.66, 0.02], scale: "1.08*(1 - 0.95*fade)"}
  head:       {scale: 1.25}
  shoulder_L: {pos: [0.18, 0.53, 0.0]}
  # the skirt from the waist, upright, trailing with `coat`
  skirtbase:  {parent: big, at: torso_rot, rot: "[lean*0.4 - coat*0.12, twist, roll]"}
  # the long hair: from the back of the head base, blown back
  hairfall:   {parent: headbase, pos: [0, 0.14, -0.05], rot: "[hair_flow - lean*0.5, 0, 0]"}

ik:
  arm_L: {lengths: [0.26, 0.25]}

parts:
  torso:           # a slim bodice with a high frosty collar
    material: gown
    space: pelvis
    blend: 0.06
    prims:
      - ellipsoid: {c: [0, 0.06, 0], r: [0.13, 0.11, 0.11]}
      - ellipsoid: {c: [0, 0.25, 0.0], r: [0.115, 0.13, 0.09]}
      - ellipsoid: {c: [0, 0.42, 0.0], r: [0.16, 0.12, 0.10]}
    paint:
      - material: skin
        prims:
          - ellipsoid: {c: [0, 0.56, 0.05], r: [0.12, 0.11, 0.12]}
  skirt:           # the long gown flaring down, turning to frost and ending in jagged icicle points
    material: gown
    space: skirtbase
    blend: 0.03
    prims:
      - revolve: {c: [0, 0, -0.01], profile: {polygon: [[-0.13, 0.1], [0.13, 0.1], [0.16, -0.14], [0.23, -0.42], [0.31, -0.74], [-0.31, -0.74], [-0.23, -0.42], [-0.16, -0.14]], round: 0.02}}
    cut:
      # tall narrow notches around the hem: the points between them read as tatters and icicles
      - ellipsoid: {c: [0.0, -0.84, 0.32], r: [0.055, 0.26, 0.08]}
      - ellipsoid: {c: [0.23, -0.84, 0.23], r: [0.07, 0.23, 0.07]}
      - ellipsoid: {c: [0.32, -0.84, 0.0], r: [0.08, 0.26, 0.055]}
      - ellipsoid: {c: [0.23, -0.84, -0.23], r: [0.07, 0.22, 0.07]}
      - ellipsoid: {c: [0.0, -0.84, -0.32], r: [0.055, 0.25, 0.08]}
      - ellipsoid: {c: [-0.23, -0.84, -0.23], r: [0.07, 0.23, 0.07]}
      - ellipsoid: {c: [-0.32, -0.84, 0.0], r: [0.08, 0.24, 0.055]}
      - ellipsoid: {c: [-0.23, -0.84, 0.23], r: [0.07, 0.26, 0.07]}
    paint:
      - material: frost
        prims:
          - cylinder: {a: [0, -0.48, 0], b: [0, -0.9, 0], r: 0.45}
  # a faint frosty mist drifting below the hem (fills the floating gap)
  hemmist:
    material: mist
    space: root
    when: "fade < 0.6"
    prims:
      - ellipsoid: {c: "[0.18 + 0.03*sin(flut), 0.12, 0.12]", r: [0.17, 0.07, 0.14]}
      - ellipsoid: {c: "[-0.19 + 0.03*sin(flut + 2), 0.10, 0.05]", r: [0.16, 0.065, 0.14]}
      - ellipsoid: {c: "[0.02, 0.09 + 0.02*sin(flut + 1), -0.18]", r: [0.19, 0.06, 0.14]}
      - ellipsoid: {c: "[0.0, 0.10 + 0.02*sin(flut + 3), 0.22]", r: [0.15, 0.06, 0.10]}
  neck:
    material: skin
    space: pelvis
    prims:
      - cone: {a: [0, 0.53, 0], b: [0, 0.66, 0.02], r: [0.05, 0.045]}
  eye_L:           # a glowing ice-blue eye on the face's side slope
    material: eye
    space: head
    prims:
      - extrude: {c: [0.075, 0.115, 0.095], rot: [0, 0.7, 0], depth: 0.04, profile: {rect: [0.022, 0.03], round: 0.007}}
  crown:           # the kokoshnik of icicles: a thin ice band and five spikes standing up behind the fringe
    material: ice
    space: head
    blend: 0.02
    priority: 2
    prims:
      - torus: {c: [0, 0.21, -0.03], R: 0.12, r: 0.022, rot: [0, 0, 0]}
      - cone: {a: [0, 0.18, 0.0], b: [0, 0.50, -0.06], r: [0.045, 0.01]}
      - cone: {a: [0.08, 0.17, -0.01], b: [0.17, 0.42, -0.07], r: [0.04, 0.009]}
      - cone: {a: [-0.08, 0.17, -0.01], b: [-0.17, 0.42, -0.07], r: [0.04, 0.009]}
      - cone: {a: [0.13, 0.14, -0.04], b: [0.27, 0.30, -0.09], r: [0.032, 0.008]}
      - cone: {a: [-0.13, 0.14, -0.04], b: [-0.27, 0.30, -0.09], r: [0.032, 0.008]}
  arm_L:           # long sleeves of the gown, widening into a bell at the wrist
    material: gown
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.05}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.045, 0.04]}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.04, 0.07]}
  sleeve_L:        # the tattered sleeve tail hanging from the wrist, rippling
    material: gown
    space: wrist_L
    blend: 0.02
    prims:
      - tube: {pts: [[0, -0.02, -0.03], [0, -0.10, -0.06], "[0.02*sin(flut + 0.5), -0.20, -0.10]", "[0.03*sin(flut + 1.4), -0.30, -0.14]"], r: [0.05, 0.012]}
    paint:
      - material: frost
        prims:
          - sphere: {c: [0, -0.27, -0.13], r: 0.07}
  hand_L:
    material: skin
    space: wrist_L
    prims:
      - ellipsoid: {c: [0, 0, 0.035], r: [0.032, 0.042, 0.05]}
  shards_L:        # tiny ice crystals orbiting the hand
    material: shard
    space: wrist_L
    min_cover: 1
    priority: 2
    when: "fade < 0.3"
    prims:
      - ellipsoid: {c: "[0.11*cos(spin), 0.07 + 0.03*sin(2*spin), 0.04 + 0.11*sin(spin)]", r: [0.02, 0.04, 0.02]}
      - ellipsoid: {c: "[0.12*cos(spin + 2.1), 0.02 + 0.03*sin(2*spin + 1), 0.04 + 0.12*sin(spin + 2.1)]", r: [0.018, 0.035, 0.018]}
      - ellipsoid: {c: "[0.10*cos(spin + 4.2), 0.10 + 0.03*sin(2*spin + 2), 0.04 + 0.10*sin(spin + 4.2)]", r: [0.02, 0.04, 0.02]}
  sopel:           # the icicle forming in the right hand while winding up (gone on release)
    material: sopel
    space: wrist_R
    when: "frost > 0.05"
    priority: 2
    min_cover: 1
    prims:
      - cone: {a: [0, 0, 0.04], b: "[0, 0, 0.06 + 0.40*frost]", r: "[0.06*frost + 0.012, 0.008]"}
      - cone: {a: [0, 0, 0.04], b: "[0, 0, -0.02 - 0.06*frost]", r: "[0.05*frost + 0.01, 0.01]"}
  leg_L: {when: "0"}
  boot_L: {when: "0"}
  # the long hair blown back by the wind, in strands (inner lines between parts)
  mane:
    material: hair
    space: hairfall
    blend: 0.03
    prims:
      - tube: {pts: [[0, -0.08, -0.10], [0, -0.36, -0.22], "[0.04*sin(flut), -0.62, -0.28]", "[-0.05*sin(flut + 0.8), -0.86, -0.36]"], r: [0.11, 0.03]}
  mane_L:          # side locks fanning OUT to both sides in the freezing wind (mirrored)
    material: hair
    space: hairfall
    blend: 0.03
    prims:
      - tube: {pts: [[0.10, -0.08, -0.06], "[0.18 + 0.05*hair_fan, -0.28, -0.16]", "[0.23 + 0.07*hair_fan + 0.04*sin(flut + 0.6), -0.50, -0.26]", "[0.28 + 0.09*hair_fan + 0.05*sin(flut + 1.5), -0.70, -0.36]"], r: [0.06, 0.018]}
  # death: frost mist swelling and drifting outward
  puff_L:
    material: mist
    space: root
    when: "puff > 0.05"
    prims:
      - ellipsoid: {c: "[0.12 + 0.30*puff, 0.95 + 0.25*puff, 0.05]", r: "[0.25*puff*(1.6 - puff), 0.20*puff*(1.6 - puff), 0.25*puff*(1.6 - puff)]"}
      - ellipsoid: {c: "[0.10 + 0.20*puff, 0.55 + 0.10*puff, -0.10 - 0.15*puff]", r: "[0.22*puff*(1.6 - puff), 0.18*puff*(1.6 - puff), 0.22*puff*(1.6 - puff)]"}
  puff_mid:
    material: mist
    space: root
    when: "puff > 0.05"
    prims:
      - ellipsoid: {c: "[0, 0.75 + 0.45*puff, 0.10 + 0.10*puff]", r: "[0.33*puff*(1.6 - puff), 0.25*puff*(1.6 - puff), 0.30*puff*(1.6 - puff)]"}
      - ellipsoid: {c: "[0, 0.40 + 0.20*puff, -0.05]", r: "[0.30*puff*(1.5 - puff), 0.15*puff*(1.5 - puff), 0.30*puff*(1.5 - puff)]"}
  # death: ice shards bursting outward and falling
  burst_L:
    material: shard
    space: root
    when: "shatter > 0.05"
    min_cover: 1
    priority: 2
    prims:
      - ellipsoid: {c: "[0.15 + 0.45*shatter, 1.25 + 0.3*shatter - 0.6*shatter*shatter, 0.10]", r: [0.03, 0.05, 0.03], rot: "[0, 0, 0.8 + 3*shatter]"}
      - ellipsoid: {c: "[0.10 + 0.35*shatter, 0.95 + 0.2*shatter - 0.5*shatter*shatter, -0.20 - 0.2*shatter]", r: [0.025, 0.045, 0.025], rot: "[0, 0, -0.6 - 2*shatter]"}
      - ellipsoid: {c: "[0.05 + 0.25*shatter, 0.70 + 0.25*shatter - 0.5*shatter*shatter, 0.25 + 0.2*shatter]", r: [0.025, 0.04, 0.025], rot: "[0, 0, 0.3 + 2.5*shatter]"}

sockets:
  hand_L: {bone: wrist_L, offset: [0, 0, 0.06]}
  sopel: {bone: wrist_R, offset: [0, 0, 0.12]}
  ground: {bone: root}

animations:
  # hovering: a slow 1.5 px bob, hair, sleeves and mist ripple, the crystals orbit the hands
  idle:
    frames: 8
    ms: 140
    channels:
      bob: "0.045*sin(p)"
      head_pitch: "-0.04*sin(p - 0.5)"
      hand_L: "[0.27, 0.06 + 0.03*sin(p - 0.6), 0.08]"
      hand_R: "[0.27, 0.06 + 0.03*sin(p - 0.9), 0.08]"
      coat: "0.25*sin(p - 1.0)"
      flut: "p"
      spin: "p"
      hair_fan: "0.3*sin(p - 1.2)"
      hair_flow: "0.15 + 0.05*sin(p - 1.5)"
  # gliding flight: leaning into the motion, gown, hair and sleeves trail back, arms back
  walk:
    frames: 8
    ms: 100
    channels:
      lean: 0.16
      bob: "0.03*sin(p)"
      roll: "0.025*sin(p)"
      head_pitch: "-0.08 + 0.03*sin(p - 0.5)"
      hand_L: "[0.30, 0.10 + 0.03*sin(p - 0.6), -0.10 + 0.02*sin(p - 1.0)]"
      hand_R: "[0.30, 0.10 + 0.03*sin(p - 0.9), -0.10 + 0.02*sin(p - 1.3)]"
      coat: "-0.7 + 0.2*sin(2*p - 1.0)"
      flut: "2*p"
      spin: "p"
      hair_fan: "0.2 + 0.2*sin(2*p - 1.2)"
      hair_flow: "0.3 + 0.05*sin(2*p - 1.4)"
  # the throw: the right hand rises back over the shoulder while the icicle grows in it (windup, the torso
  # turns away), then the arm whips forward (release: the icicle leaves the hand), follow-through
  attack:
    loop: false
    keys:
      - {ms: 110, event: windup, set: {flut: 0.8, spin: 0.8, bob: 0.01, twist: -0.10, lean: -0.02, frost: 0.3, coat: 0.1, hair_flow: 0.15,
          hand_L: [0.30, 0.10, 0.12], hand_R: [0.30, 0.30, -0.05]}}
      - {ms: 150, set: {flut: 1.6, spin: 1.6, bob: 0.03, twist: -0.25, lean: -0.08, roll: 0.05, frost: 0.65, coat: -0.1, hair_flow: 0.1, hair_fan: 0.3, head_pitch: -0.05,
          hand_L: [0.34, 0.20, 0.18], hand_R: [0.32, 0.60, -0.10]}}
      - {ms: 160, set: {flut: 2.4, spin: 2.4, bob: 0.04, twist: -0.30, lean: -0.12, roll: 0.07, frost: 1.0, coat: -0.2, hair_flow: 0.05, hair_fan: 0.5, head_pitch: -0.08,
          hand_L: [0.36, 0.24, 0.22], hand_R: [0.32, 0.70, -0.12]}}
      - {ms: 60, event: release, set: {flut: 3.4, spin: 3.4, bob: 0.0, twist: 0.35, lean: 0.18, roll: -0.04, coat: 0.4, hair_flow: 0.0, hair_fan: 0.2, head_pitch: 0.06,
          hand_L: [0.30, 0.02, -0.12], hand_R: [0.02, 0.36, 0.48]}}
      - {ms: 80, set: {flut: 4.2, spin: 4.2, bob: -0.01, twist: 0.45, lean: 0.20, roll: -0.05, coat: 0.35, hair_flow: 0.05, hair_fan: 0.1, head_pitch: 0.06,
          hand_L: [0.30, 0.0, -0.14], hand_R: [-0.06, 0.16, 0.38]}, tween: 1, ease: out}
      - {ms: 120, set: {flut: 5.2, spin: 5.2, bob: 0.0, twist: 0.05, lean: 0.04, coat: 0.1, hair_flow: 0.15,
          hand_L: [0.28, 0.05, 0.06], hand_R: [0.24, 0.06, 0.10]}}
  # hit: a flinch back, hair and gown whip forward, she drifts back
  hit:
    loop: false
    keys:
      - {ms: 70, set: {root: [0, 0, -0.06], lean: -0.25, bob: 0.03, squash: 0.96, head_pitch: -0.3, coat: 0.5, flut: 1, spin: 1,
          hand_L: [0.34, 0.18, -0.06], hand_R: [0.34, 0.18, -0.06], hair_flow: 0.0, hair_fan: 0.5}}
      - {ms: 70, set: {root: [0, 0, -0.04], lean: -0.12, bob: 0.02, squash: 0.98, head_pitch: -0.12, coat: 0.25, flut: 2, spin: 2,
          hand_L: [0.31, 0.12, 0.0], hand_R: [0.31, 0.12, 0.0], hair_flow: 0.2, hair_fan: 0.25}}
      - {ms: 80, set: {root: [0, 0, -0.01], lean: 0.02, head_pitch: 0.02, coat: -0.05, flut: 3, spin: 3,
          hand_L: [0.28, 0.07, 0.07], hand_R: [0.28, 0.07, 0.07], hair_flow: 0.3}}
  # death: struck back with the arms thrown out, then she shatters into frost: the body shrinks and rises,
  # frost mist swells, ice shards burst outward and fall, a last thin frosty wisp
  death:
    loop: false
    keys:
      - {ms: 110, set: {root: [0, 0, -0.05], lean: -0.35, bob: 0.04, head_pitch: -0.4, coat: 0.5, flut: 1, spin: 1,
          hand_L: [0.40, 0.36, -0.04], hand_R: [0.40, 0.36, -0.04], hair_flow: 0.05, hair_fan: 0.6}}
