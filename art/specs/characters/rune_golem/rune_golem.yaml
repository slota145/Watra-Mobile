spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: rune_golem
camera: {"pitch": 38, "scale": 0.04889, center: [0, 1.42, 0]}
palette: "watra"
size: 96
extends: humanoid   # tylko szkielet szablonu; głowa, włosy, miecz, płaszcz, pas i szyja usunięte

# Runiczny golem: silny, powolny potwór lochu „Wieża Kościeja” (żywioł Arkana - fioletowo-biała magia).
# Konstrukt z ciemnego kamienia i żelaza złożony z kanciastych płyt, ok. 48 px wobec 36 px człowieka (ta sama
# camera.scale, jak kumir). W środku piersi kryształ Arkanów w żelaznej obręczy, na płytach świecące fioletowe
# runy (warstwa emisyjna: kryształ, runy, szczelina oka). Głowa to niski blok-hełm z jedną świecącą szczeliną.
# Cała postać rośnie przez kość `big` (1.55) pod `root`; przy śmierci płyty odpadają, a kryształ gaśnie.
brief:
  summary: >
    a rune golem of the Wieża Kościeja, a slow heavy tank about 48 px tall against a 36 px human (same density):
    a construct of dark slate stone plates held by iron bands and rivets, square shoulders, a low block head with
    one glowing violet visor slit, a violet Arcane crystal set in an iron ring in the middle of the chest, violet
    glowing runes on the plates (chest, shoulders, forearms, shins), big block fists
  head: >
    a low square stone block sunk between the shoulders (no neck to speak of), its front a flat plate with one
    horizontal glowing violet slit (the face, minimal style), an iron band round its brow
  must_keep:
    - the violet crystal in the chest - the brightest pixels, reads from s and the diagonals
    - the violet runes on the dark plates (emissive) and the visor slit
    - the mass - square shoulders, a block torso, block fists; dark cold stone, iron bands lighter and metallic
    - death - the plates fall off into a heap, the runes and the crystal go out
  simplify:
    - the body is a few big plates (pelvis, chest, shoulder pauldrons, head); joints between them are iron bands
      painted on, runes are short strokes and rings painted on the plates
    - no fingers - each fist is one block with an iron knuckle band
  decisions:
    - the kumir's skeleton and attack contract (`hit` at 750 ms, total 1050 ms, socket `impact`)
    - two paint layers on every rune - a dim one (rune_dim, width x `ember`) under a bright one (width x `glow`);
      idle pulses `glow`, death drives `glow` and then `ember` to 0; the crystal swaps to dead stone below glow 0.3
    - mechanical walk - stiff, almost no twist, a small bob, a hard plant on each step

ramps:
  # ciemny łupek: zimny szarogranatowy kamień
  slate:  ["#07070b", "#1b1a23", "#2e2c3a", "#43404f", "#5b5869", "#767387"]
  # żelazne obręcze i nity
  iron:   ["#0b0a0c", "#2c2a2e", "#4a474d", "#6a666c", "#8e8a8f", "#b6b2b4"]
  # wyryte szczeliny między płytami (bez obrysu)
  carve:  ["#050508", "#0f0e15", "#1a1822", "#24222e"]
  # fioletowo-biała magia Arkanów
  arcane: ["#24103f", "#7a3fc4", "#b07ef0", "#eadcff", "#ffffff"]
  # zgasły kryształ
  deadcrystal: ["#0a0810", "#1e1a2a", "#322b44", "#463d5c", "#5c5274"]
  fx_tail: ["#7a3fc4"]
  fx_mid:  ["#b07ef0"]
  fx_core: ["#f6f1ff"]

materials:
  slate:    {ramp: slate, finish: matte, crease: true, edge_highlight: true, gamma: 1.3}
  iron:     {ramp: iron, finish: metal}
  carve:    {ramp: carve, bands: [1, 2], outline: false, line: false}
  rune:     {ramp: arcane, emissive: true, band: 3, outline: false, glow: {color: "#b07ef0", mix: 0.3, radius: 1}}
  rune_dim: {ramp: arcane, emissive: true, band: 1, outline: false}
  crystal:  {ramp: arcane, emissive: true, band: 2, outline: false, glow: {color: "#b07ef0", mix: 0.3, radius: 1}}
  core:     {ramp: arcane, emissive: true, band: 4, outline: false}
  deadcrystal: {ramp: deadcrystal, finish: glossy}
  eye:      {ramp: arcane, emissive: true, band: 4, outline: false, glow: {color: "#b07ef0", mix: 0.35, radius: 1}}
  fx_tail:  {ramp: fx_tail, emissive: true}
  fx_mid:   {ramp: fx_mid, emissive: true}
  fx_core:  {ramp: fx_core, emissive: true}

remove: [use.sword, use.head, use.hair, parts.belt, parts.coat, parts.neck]

shadow: {rx: 22, ry: 8, alpha: 130}
snap: [root, torso_rot]   # ruch ciała o całe piksele: powolne kołysanie nie migocze

channels:
  hand_L: [0.50, -0.20, 0.08]
  hand_R: [0.50, -0.20, 0.08]
  foot_L: [0.16, 0, 0.02]
  glow: 1        # jasne runy i kryształ (idle pulsuje, śmierć gasi)
  ember: 1       # przygaszone runy pod jasnymi (śmierć gasi je na końcu)
  rubble: 0      # śmierć: stos odpadłych płyt
  shed: 0        # śmierć: płyty barków i hełm odpadają (0..1)
  smear_r: 0.55
  smear_y: 0.55
  smear_z: 0.35

bones:
  big:        {parent: root, scale: 1.55}
  torso_rot:  {parent: big, pos: "[0, 0.70 + bob, 0]", rot: "[lean + 0.03, twist, roll]"}
  legyaw:     {parent: big}
  footyaw:    {parent: big}
  fxspace:    {parent: big}
  headbase:   {pos: [0, 0.54, 0.03], scale: 1.6, rot: "[lean*0.6 - 0.03, twist, roll]"}
  head:       {scale: 1.0}
  shoulder_L: {pos: [0.36, 0.42, 0.0]}
  hip_L:      {pos: [0.15, -0.02, 0.0]}
  # odpadający naramiennik: zsuwa się w bok i w dół (śmierć)
  pauld_L:    {parent: pelvis, pos: "[0.39 + 0.15*shed, 0.46 - 0.40*shed, 0.12*shed]", rot: "[0.4*shed, 0, -1.0*shed]"}

ik:   # jednostki świata (bez skali `big`)
  arm_L: {lengths: [0.60, 0.58], pole: [0.4, 0.0, -1.0]}
  leg_L: {space: big, lengths: [0.53, 0.52]}

parts:
  torso:           # blok miednicy, wysoki blok piersi, kanciaste barki
    material: slate
    space: pelvis
    blend: {mode: chamfer, k: 0.03}
    prims:
      - box: {c: [0, 0.03, 0.0], half: [0.22, 0.10, 0.16], round: 0.03}
      - box: {c: [0, 0.27, 0.01], half: [0.29, 0.16, 0.19], round: 0.04}
      - box: {c: [0, 0.44, -0.01], half: [0.34, 0.07, 0.18], round: 0.04}
    paint:
      - material: iron          # żelazny pas między miednicą a piersią i obręcz kryształu
        prims:
          - box: {c: [0, 0.115, 0.0], half: [0.4, 0.022, 0.4]}
          - torus: {c: [0, 0.28, 0.2], R: 0.13, r: 0.03, rot: [1.5708, 0, 0]}
      - material: carve         # szczeliny między płytami piersi
        prims:
          - box: {c: [0.20, 0.28, 0.0], half: [0.012, 0.18, 0.4]}
          - box: {c: [-0.20, 0.28, 0.0], half: [0.012, 0.18, 0.4]}
          - box: {c: [0, 0.38, -0.2], half: [0.4, 0.012, 0.1]}
      - material: rune_dim      # runy (przygaszone): kreski na płytach boków piersi i na plecach
        prims:
          - box: {c: [0.245, 0.30, 0.2], half: ["0.018*ember", 0.08, 0.1]}
          - box: {c: [-0.245, 0.30, 0.2], half: ["0.018*ember", 0.08, 0.1]}
          - box: {c: [0.245, 0.22, 0.2], half: [0.04, "0.018*ember", 0.1]}
          - box: {c: [-0.245, 0.34, 0.2], half: [0.04, "0.018*ember", 0.1]}
          - torus: {c: [0, 0.27, -0.2], R: 0.11, r: "0.022*ember", rot: [1.5708, 0, 0]}
          - box: {c: [0, 0.27, -0.2], half: ["0.018*ember", 0.14, 0.1]}
      - material: rune          # runy (jasne)
        prims:
          - box: {c: [0.245, 0.30, 0.2], half: ["0.011*glow", 0.07, 0.1]}
          - box: {c: [-0.245, 0.30, 0.2], half: ["0.011*glow", 0.07, 0.1]}
          - box: {c: [0.245, 0.22, 0.2], half: [0.035, "0.011*glow", 0.1]}
          - box: {c: [-0.245, 0.34, 0.2], half: [0.035, "0.011*glow", 0.1]}
          - torus: {c: [0, 0.27, -0.2], R: 0.11, r: "0.013*glow", rot: [1.5708, 0, 0]}
          - box: {c: [0, 0.27, -0.2], half: ["0.011*glow", 0.13, 0.1]}
  crystal:         # kryształ Arkanów w środku piersi (ośmiościan wystający z obręczy)
    material: crystal
    space: pelvis
    when: "glow >= 0.3"
    blend: 0.01
    prims:
      - box: {c: [0, 0.28, 0.20], half: [0.075, 0.075, 0.075], rot: [0.6155, 0.785, 0], round: 0.01}
    paint:
      - material: core
        prims:
          - sphere: {c: [0, 0.30, 0.28], r: "0.028*glow"}
  crystal_dead:    # zgasły kryształ (śmierć)
    material: deadcrystal
    space: pelvis
    when: "glow < 0.3"
    prims:
      - box: {c: [0, 0.28, 0.20], half: [0.08, 0.08, 0.08], rot: [0.6155, 0.785, 0], round: 0.01}
  pauldron_L:      # kanciasty naramiennik z runą, przy śmierci odpada
    material: slate
    space: pauld_L
    blend: 0.02
    prims:
      - box: {c: [0, 0, 0.0], half: [0.13, 0.09, 0.16], rot: [0, 0, -0.18], round: 0.03}
    paint:
      - material: iron
        prims:
          - box: {c: [0, -0.06, 0.0], half: [0.3, 0.018, 0.3], rot: [0, 0, -0.18]}
      - material: rune_dim
        prims:
          - torus: {c: [0.01, 0.10, 0.0], R: 0.06, r: "0.02*ember", rot: [0, 0, -0.18]}
      - material: rune
        prims:
          - torus: {c: [0.01, 0.10, 0.0], R: 0.06, r: "0.012*glow", rot: [0, 0, -0.18]}
  rivets_L:        # nity na naramienniku
    material: iron
    space: pauld_L
    prims:
      - sphere: {c: [-0.09, 0.04, 0.15], r: 0.025}
      - sphere: {c: [0.09, 0.01, 0.15], r: 0.025}
  head:            # niski blok-hełm z żelazną obręczą
    material: slate
    space: head
    blend: {mode: chamfer, k: 0.02}
    prims:
      - box: {c: [0, 0.07, 0.0], half: [0.12, 0.09, 0.11], round: 0.02}
      - box: {c: [0, 0.07, 0.085], half: [0.115, 0.08, 0.03], round: 0.01}
    paint:
      - material: iron
        prims:
          - box: {c: [0, 0.14, 0.0], half: [0.2, 0.018, 0.2]}
      - material: carve
        prims:
          - box: {c: [0, 0.07, 0.12], half: [0.10, 0.03, 0.04]}
  visor:           # jedna świecąca szczelina oka
    material: eye
    space: head
    when: "glow > 0.35"
    prims:
      - extrude: {c: [0, 0.075, 0.115], depth: 0.04, profile: {rect: [0.085, 0.017], round: 0.004}}
  arm_L:           # ciężkie ramiona z płyt
    material: slate
    space: big
    blend: 0.02
    prims:
      - sphere: {c: "@shoulder_L", r: 0.09}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.09, 0.08]}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.09, 0.10]}
    paint:
      - material: iron
        prims:
          - cylinder: {a: {between: ["@shoulder_L", "@elbow_L"], t: 0.94}, b: {between: ["@elbow_L", "@wrist_L"], t: 0.08}, r: 0.2}
      - material: rune_dim
        prims:
          - cylinder: {a: {between: ["@elbow_L", "@wrist_L"], t: 0.45}, b: {between: ["@elbow_L", "@wrist_L"], t: "0.45 + 0.07*ember"}, r: 0.2}
      - material: rune
        prims:
          - cylinder: {a: {between: ["@elbow_L", "@wrist_L"], t: 0.465}, b: {between: ["@elbow_L", "@wrist_L"], t: "0.465 + 0.04*glow"}, r: 0.2}
  hand_L:          # pięść-blok z żelaznym pasem na kłykciach
    material: slate
    space: wrist_L
    blend: {mode: chamfer, k: 0.03}
    prims:
      - box: {c: [0, 0, 0.18], half: [0.20, 0.19, 0.20], rot: [0.1, 0.2, 0.05], round: 0.04}
      - box: {c: [0, -0.01, 0.35], half: [0.18, 0.15, 0.06], round: 0.03}
    paint:
      - material: iron
        prims:
          - box: {c: [0, 0, 0.31], half: [0.4, 0.4, 0.03]}
  leg_L:           # grube nogi-słupy z runą na goleni
    material: slate
    space: big
    blend: 0.02
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.13, 0.11]}
      - cone: {a: "@knee_L", b: "@ankle_L", r: [0.11, 0.12]}
    paint:
      - material: iron
        prims:
          - cylinder: {a: {between: ["@hip_L", "@knee_L"], t: 0.92}, b: {between: ["@knee_L", "@ankle_L"], t: 0.08}, r: 0.2}
      - material: rune_dim
        prims:
          - cylinder: {a: {between: ["@knee_L", "@ankle_L"], t: 0.40}, b: {between: ["@knee_L", "@ankle_L"], t: "0.40 + 0.08*ember"}, r: 0.2}
      - material: rune
        prims:
          - cylinder: {a: {between: ["@knee_L", "@ankle_L"], t: 0.415}, b: {between: ["@knee_L", "@ankle_L"], t: "0.415 + 0.045*glow"}, r: 0.2}
  boot_L:          # płaska żelazna stopa
    material: iron
    space: sole_L
    blend: 0.02
    prims:
      - box: {c: [0, -0.02, 0.05], half: [0.11, 0.05, 0.15], round: 0.02}
  rubble:          # śmierć: stos odpadłych płyt (rozmiary rosną z `rubble`)
    material: slate
    space: big
    when: "rubble > 0.02"
    blend: 0.02
    prims:
      - box: {c: [0, 0.10, 0.10], half: "[0.30, 0.11, 0.26]*rubble", rot: [0.1, 0.2, 0.05], round: 0.03}
      - box: {c: [0.38, 0.05, 0.30], half: "[0.15, 0.05, 0.12]*rubble", rot: [0.2, 0.5, 0.1], round: 0.02}
      - box: {c: [-0.42, 0.05, 0.18], half: "[0.14, 0.05, 0.13]*rubble", rot: [0.1, -0.4, 0.2], round: 0.02}
      - box: {c: [0.08, 0.05, 0.52], half: "[0.14, 0.05, 0.10]*rubble", rot: [0.3, 0.8, 0.0], round: 0.02}
      - box: {c: [-0.26, 0.05, 0.46], half: "[0.11, 0.05, 0.10]*rubble", rot: [0.0, 0.3, 0.3], round: 0.02}
      - box: {c: [0.34, 0.05, -0.18], half: "[0.13, 0.05, 0.12]*rubble", rot: [0.2, 1.1, 0.0], round: 0.02}
      - box: {c: [-0.32, 0.05, -0.16], half: "[0.12, 0.05, 0.11]*rubble", rot: [0.1, 0.6, 0.2], round: 0.02}
    paint:
      - material: iron
        prims:
          - box: {c: [0, 0.14, 0.12], half: [0.6, 0.02, 0.6], rot: [0.15, 0, 0.1]}
      - material: rune_dim
        prims:
          - box: {c: [0.38, 0.08, 0.30], half: ["0.02*ember", 0.1, 0.08], rot: [0, 0.5, 0]}
          - box: {c: [-0.42, 0.08, 0.18], half: [0.08, 0.1, "0.02*ember"], rot: [0, -0.4, 0]}

sockets:
  impact: {bone: big, offset: [0, 0.02, 0.60]}   # ziemia przed nim, gdzie lądują pięści (fala uderzenia)
  fist_L: {bone: wrist_L, offset: [0, 0, 0.2]}
  crystal: {bone: pelvis, offset: [0, 0.28, 0.24]}    # kryształ w piersi (błysk)

animations:
  # ledwie widoczne kołysanie i pulsowanie run oraz kryształu
  idle:
    frames: 8
    ms: 170
    channels:
      bob: "0.02*sin(p)"
      roll: "0.015*sin(p)"
      head_pitch: "0.03*sin(p - 0.8)"
      glow: "1.05 + 0.3*sin(p)"
      hand_L: "[0.50, -0.20 + 0.02*sin(p - 0.6), 0.08]"
      hand_R: "[0.50, -0.20 + 0.02*sin(p - 0.6), 0.08]"
  # ciężki, mechaniczny krok: noga unosi się nisko i stawiana jest twardo, ciało przechyla się na nogę podporową
  walk:
    frames: 8
    ms: 150
    events: {0: step_l, 4: step_r}
    channels:
      lean: "0.04"
      bob: "-0.04*cos(2*p) - 0.01"
      squash: "1 - 0.02*cos(2*p)"
      twist: "0.03*cos(p)"
      roll: "0.08*sin(p)"
      head_yaw: "0.04*sin(p)"
      glow: "1.0 + 0.2*cos(2*p)"
      foot_L: "[0.16, 0.07*sin(pi*clamp((p/tau - 0.5)/0.5, 0, 1)), 0.03 + 0.18 - 0.36*clamp(p/tau/0.5, 0, 1) + 0.36*clamp((p/tau - 0.5)/0.5, 0, 1)**2*(3 - 2*clamp((p/tau - 0.5)/0.5, 0, 1))]"
      foot_R: "[0.16, 0.07*sin(pi*clamp((p/tau + 0.5 - floor(p/tau + 0.5) - 0.5)/0.5, 0, 1)), 0.03 + 0.18 - 0.36*clamp((p/tau + 0.5 - floor(p/tau + 0.5))/0.5, 0, 1) + 0.36*clamp((p/tau + 0.5 - floor(p/tau + 0.5) - 0.5)/0.5, 0, 1)**2*(3 - 2*clamp((p/tau + 0.5 - floor(p/tau + 0.5) - 0.5)/0.5, 0, 1))]"
      pitch_foot_L: "0.15*sin(pi*clamp((p/tau - 0.5)/0.5, 0, 1))"
      pitch_foot_R: "0.15*sin(pi*clamp((p/tau + 0.5 - floor(p/tau + 0.5) - 0.5)/0.5, 0, 1))"
      hand_L: "[0.50, -0.19 + 0.02*pos(cos(p)), 0.08 - 0.08*cos(p)]"
      hand_R: "[0.50, -0.19 + 0.02*pos(-cos(p)), 0.08 + 0.08*cos(p)]"
  # obie pięści wysoko nad głową (trzymane: ostrzeżenie w grze), runy i kryształ rozjarzają się, szybka klatka
  # ze smugą, pięści uderzają w ziemię przed nim (`hit` po 750 ms), krótkie trzymanie, powolny powrót; razem 1050 ms
  attack:
    loop: false
    keys:
      - {ms: 120, event: windup, set: {lean: 0.12, bob: -0.05, squash: 0.95, head_pitch: 0.06,
          hand_L: [0.28, -0.14, 0.28], hand_R: [0.28, -0.14, 0.28]}}
      - {ms: 150, set: {lean: 0.0, bob: 0.0, squash: 1.0, head_pitch: -0.04, glow: 1.2,
          hand_L: [0.26, 0.38, 0.22], hand_R: [0.26, 0.38, 0.22], foot_L: [0.17, 0, 0.08], foot_R: [0.17, 0, -0.04]}}
      - {ms: 210, set: {lean: -0.16, bob: 0.03, squash: 1.04, head_pitch: -0.08, glow: 1.4,
          hand_L: [0.18, 0.86, 0.02], hand_R: [0.18, 0.86, 0.02], foot_L: [0.17, 0, 0.10], foot_R: [0.17, 0, -0.05]}}
      - {ms: 210, set: {lean: -0.20, bob: 0.04, squash: 1.05, head_pitch: -0.10, glow: 1.6,
          hand_L: [0.16, 0.92, -0.04], hand_R: [0.16, 0.92, -0.04], foot_L: [0.17, 0, 0.10], foot_R: [0.17, 0, -0.05]}}
      - {ms: 60, set: {lean: 0.12, bob: -0.02, squash: 1.0, head_pitch: 0.04, glow: 1.5,
          hand_L: [0.14, 0.45, 0.50], hand_R: [0.14, 0.45, 0.50], foot_L: [0.17, 0, 0.14], foot_R: [0.17, 0, -0.06],
          smear_w: 0.12, smear_a0: 2.0, smear_a1: 0.7}}
      - {ms: 100, event: hit, set: {root: [0, 0, 0.07], lean: 0.42, bob: -0.12, squash: 0.90, head_pitch: 0.10, glow: 1.8,
          hand_L: [0.14, 0.0, 0.72], hand_R: [0.14, 0.0, 0.72], foot_L: [0.17, 0, 0.18], foot_R: [0.17, 0, -0.07],
          smear_w: 0.10, smear_a0: 1.0, smear_a1: -0.6, smear_fade: 0.6}}
      - {ms: 100, set: {root: [0, 0, 0.07], lean: 0.40, bob: -0.11, squash: 0.92, head_pitch: 0.08, glow: 1.3,
