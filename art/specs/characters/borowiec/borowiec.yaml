          hand_L: [0.22, 0.30, 0.24], bow_tilt: -0.3, bow_roll: -1.2, bow_cheat: 0, arm_up: [0, 1, 0],
          hand_R: [0.20, 0.28, -0.06]}}
      - {ms: 130, set: {twist: -0.05, lean: 0.03, coat: 0.05,
          hand_L: [0.23, 0.06, 0.09], bow_tilt: -0.75, bow_roll: 0.4,
          hand_R: [0.26, 0.06, 0.15]}}
  # hit reaction: body and head snap back, the horn leaves shake, then return
  hit:
